# Copy to .github/workflows/ci.yml once the pushing token has the
# `workflow` scope (gh auth refresh -s workflow).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Tests (simulated camera, no hardware)
        run: python -m unittest discover -s tests -v
      - name: Smoke test the CLI
        env:
          OZURE_HOME: ${{ runner.temp }}/ozure
          OZURE_MOCK: "1"
        run: |
          python -m ozure doctor --json
          python -m ozure connect --mock
          python -m ozure apply eterna-cinema --slot C2 --yes --mock --json
          python -m ozure list --mock
