[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ozure"
version = "0.2.1"
description = "Read, edit and install Fujifilm custom recipes over USB PTP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alex Pérez Fernández" }]
keywords = ["fujifilm", "ptp", "recipes", "camera", "agent-skill", "x100vi", "film-simulation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics :: Capture :: Digital Camera",
]

dependencies = []

[project.optional-dependencies]
usb = ["pyusb>=1.2", "libusb-package>=1.0.26.1"]

[project.scripts]
ozure = "ozure.cli:main"

[project.urls]
Homepage = "https://github.com/AlPeFe/ozure"
Source = "https://github.com/AlPeFe/ozure"
Issues = "https://github.com/AlPeFe/ozure/issues"
Documentation = "https://github.com/AlPeFe/ozure/tree/main/docs"
Changelog = "https://github.com/AlPeFe/ozure/commits/main"

[tool.setuptools]
packages = ["ozure"]

[tool.setuptools.package-data]
ozure = [
  "py.typed",
  "data/catalog/*/catalog.json",
  "data/catalog/*/*.json",
  "data/catalog/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",   # long lines in the embedded format documentation
  "RUF001", # the docs deliberately use typographic punctuation
  "RUF002",
  "RUF003",
]
